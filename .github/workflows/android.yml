name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel a superseded run when push + pull_request fire for the same ref.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Install exactly what the build needs; the legacy "tools" package the
          # action installs by default was removed by Google and fails.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-scanner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
